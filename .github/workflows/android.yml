name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-app-integrity:
    name: Web app integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # index.html was once published with three HTML documents concatenated into
      # it, which rendered a dead second copy of the whole calculator. These checks
      # fail the build rather than let that ship again.
      - name: index.html must be exactly one HTML document
        run: |
          for tag in '<!DOCTYPE' '<html' '</html>' '<body>' '</body>'; do
            count=$(grep -c -- "$tag" index.html || true)
            echo "$tag -> $count"
            if [ "$count" -ne 1 ]; then
              echo "::error file=index.html::expected exactly one '$tag', found $count"
              exit 1
            fi
          done

      - name: No duplicate element ids
        run: |
          # Static id attributes only: skip data-id and any value holding a "${...}"
          # template placeholder, which the page builds its rows with at runtime.
          dupes=$(grep -oE '(^|[[:space:]])id="[^"$]*"' index.html | tr -d ' ' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error file=index.html::duplicate ids: $dupes"
            exit 1
          fi
          echo "no duplicate ids"

  android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: web-app-integrity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' because the action's default package list still contains the
      # retired "tools" package, which sdkmanager now fails on. The runner image
      # already ships the SDK; this step is here to accept the licences.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK (unsigned)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # The page is copied into the APK at build time, so prove the copy happened
      # and that what shipped is byte-for-byte the page in the repository root.
      - name: Packaged page matches the repository page
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$apk" assets/index.html > packaged-index.html
          diff index.html packaged-index.html
          echo "packaged page is identical to index.html"
          unzip -l "$apk" | grep -E 'assets/' || true

      # The app asks the system for nothing, which is what turns the page's
      # "nothing is transmitted" line into something Android enforces rather than
      # a promise. Assert it against the built APK, not the source manifest.
      - name: APK requests no permission outside its own namespace
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "using $aapt2"
          perms=$("$aapt2" dump permissions "$apk" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p")
          echo "declared: ${perms:-<none>}"
          # androidx.core defines DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION inside the
          # application's own package to guard the non-exported receivers it registers
          # at runtime. It is a signature permission the app both defines and holds,
          # so it grants nothing to or from anywhere else. Anything in another
          # namespace — android.permission.INTERNET above all — is a real request.
          external=$(printf '%s\n' "$perms" | grep -v '^io\.github\.onurerturk80\.ivftriage\.' | grep -v '^$' || true)
          if [ -n "$external" ]; then
            echo "::error::the APK requests permissions: $external"
            exit 1
          fi
          echo "no permission requested outside the app's own namespace"

      # sw.js is left out on purpose: in an APK the assets are already local, and a
      # service-worker cache could serve a stale page after an app update.
      - name: sw.js is not packaged
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          if unzip -l "$apk" | grep -q 'assets/sw.js'; then
            echo "::error::sw.js was packaged into the APK"
            exit 1
          fi
          echo "sw.js correctly absent"

      - uses: actions/upload-artifact@v4
        with:
          name: ivf-triage-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ivf-triage-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
